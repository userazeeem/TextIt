<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TextIt</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="logo">
            <span>TEXT</span> IT
        </div>

        <div class="header-right">
            <span>Translator</span>
        </div>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main>


        <!-- HERO -->

        <section class="hero">

            <p class="small-title">
                SIMPLE • FAST • GLOBAL
            </p>

            <h1>
                Translate your
                <span>world.</span>
            </h1>

            <p class="description">
                Enter your text, choose a language,
                and translate it instantly.
            </p>

        </section>



        <!-- =========================
             TRANSLATOR
        ========================== -->

        <section class="translator">


            <!-- SOURCE BOX -->

            <div class="translation-box">

                <div class="box-header">

                    <select id="sourceLanguage">

                        <option value="en">
                            English
                        </option>

                        <option value="kn">
                            Kannada
                        </option>

                        <option value="hi">
                            Hindi
                        </option>

                        <option value="te">
                            Telugu
                        </option>

                        <option value="ta">
                            Tamil
                        </option>

                        <option value="ml">
                            Malayalam
                        </option>

                        <option value="fr">
                            French
                        </option>

                        <option value="de">
                            German
                        </option>

                        <option value="es">
                            Spanish
                        </option>

                        <option value="ja">
                            Japanese
                        </option>

                    </select>


                    <button id="clearBtn">
                        CLEAR
                    </button>

                </div>


                <textarea
                    id="inputText"
                    maxlength="1000"
                    placeholder="Enter your text here..."
                ></textarea>


                <div class="box-footer">

                    <span id="charCount">
                        0 / 1000
                    </span>

                </div>

            </div>



            <!-- =========================
                 SWAP BUTTON
            ========================== -->

            <button
                class="swap-btn"
                id="swapBtn"
                title="Swap languages"
            >
                ⇄
            </button>



            <!-- =========================
                 TARGET BOX
            ========================== -->

            <div class="translation-box">

                <div class="box-header">

                    <select id="targetLanguage">

                        <option value="kn">
                            Kannada
                        </option>

                        <option value="en">
                            English
                        </option>

                        <option value="hi">
                            Hindi
                        </option>

                        <option value="te">
                            Telugu
                        </option>

                        <option value="ta">
                            Tamil
                        </option>

                        <option value="ml">
                            Malayalam
                        </option>

                        <option value="fr">
                            French
                        </option>

                        <option value="de">
                            German
                        </option>

                        <option value="es">
                            Spanish
                        </option>

                        <option value="ja">
                            Japanese
                        </option>

                    </select>


                    <button id="copyBtn">
                        COPY
                    </button>

                </div>


                <div
                    id="outputText"
                    class="output"
                >
                    Translation will appear here...
                </div>


                <div class="box-footer">

                    <span id="status">
                        Ready
                    </span>

                </div>

            </div>

        </section>



        <!-- =========================
             TRANSLATE BUTTON
        ========================== -->

        <button
            class="translate-btn"
            id="translateBtn"
        >

            <span id="buttonText">
                TRANSLATE
            </span>

            <span
                id="loader"
                class="loader"
            ></span>

        </button>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 TextIT
        </p>

        <p>
            BUILT TO TRANSLATE
        </p>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <!--
        type="module" is important.
        Transformers.js will be imported
        from script.js.
    -->

    <script
        type="module"
        src="script.js"
    ></script>


</body>

</html>
